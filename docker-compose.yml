# Local production-like stack: API (SQLite, demo-seeded) + web (nginx proxying
# /api and /uploads to the API). No Cloudinary or external accounts needed.
#
#   docker compose up --build
#   → app   at http://localhost:8080
#   → API   at http://localhost:5000/api/health
#   → login as admin@roadguard.gov / Admin@123 (demo seed)
services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        PRISMA_PROVIDER: sqlite
    environment:
      NODE_ENV: production
      PORT: "5000"
      DATABASE_URL: "file:/data/dev.db"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-dev-access-secret-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-dev-refresh-secret-change-me}
      CORS_ORIGIN: http://localhost:8080
      TRUST_PROXY: "1"
      AUTO_SCHEMA: "true"
      SEED_DEMO: "true"
    volumes:
      - rg-data:/data
      - rg-uploads:/app/backend/uploads
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_UPSTREAM: http://api:5000
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  rg-data:
  rg-uploads:
