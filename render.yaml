# Render Blueprint — RoadGuard API.
#
# Deploy the frontend separately (Vercel or a Render static site) and point
# VITE_API_URL at this service; set CORS_ORIGIN to that frontend's URL.
# Full walkthrough: docs/deploy.md
services:
  - type: web
    name: roadguard-api
    runtime: docker
    plan: starter
    dockerContext: .
    dockerfilePath: backend/Dockerfile
    buildArgs:
      # Must match the target database. postgresql for Supabase/Render Postgres;
      # sqlite only for ephemeral/local use (data is not durable).
      PRISMA_PROVIDER: postgresql
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "5000"
      - key: TRUST_PROXY
        value: "1"
      # Generated by Render on first deploy (never committed):
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # Fill these in the Render dashboard — real credentials stay secret:
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
